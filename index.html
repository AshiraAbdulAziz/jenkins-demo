<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic HTML Page</title>
    <style>
      :root {
        --bg: #f4f4f4;
        --card: #ffffff;
        --text: #222222;
        --muted: #666666;
        --primary: #2f6fed;
        --border: #d9d9d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        max-width: 900px;
        margin: 60px auto;
        padding: 24px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      }

      h1 {
        margin-top: 0;
        font-size: 2.2rem;
      }

      p {
        color: var(--muted);
        font-size: 1rem;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        background: var(--primary);
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        margin-top: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Hello, World!</h1>
        <p>This is a simple HTML page created with basic structure and styling.</p>
        <a href="#" class="btn">Learn More</a>
      </div>
    </div>
  </body>
</html>
